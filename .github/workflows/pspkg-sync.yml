name: PSPKG PS5 Arabic catalog daily check
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper libraries
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scan public PSPKG PS5 Arabic pages
        run: python scripts/pspkg_sync.py
      - name: Commit real catalog changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PS5_Arabic_PSPKG_catalog.json ps5_arabic_needs_download_links.json
          if git diff --staged --quiet; then
            echo "No catalog changes today"
          else
            git commit -m "Sync PSPKG Arabic PS5 catalog"
            git push
          fi
